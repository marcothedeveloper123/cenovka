  - 'dialog "Než budete pokračovat: Informace ke zpracovávání vašich údajů" [ref=e924]':
    - generic [ref=e925]:
      - generic [ref=e927]:
        - 'heading "Než budete pokračovat: Informace ke zpracovávání vašich údajů" [level=2] [ref=e928]'
        - generic [ref=e929]:
          - text: My, společnost
          - link "Kaufland Marketplace GmbH" [ref=e930] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: ", zpracováváme vaše údaje, které shromažďujeme také od třetích stran, na našich webových stránkách pomocí různých technik, které umožňují ukládání a přístup k informacím ve vašem koncovém zařízení. Některé z těchto údajů jsou technicky nezbytné nebo jsou na základě vašeho souhlasu používány také našimi partnery (mj. jako"
          - link "samostatní" [ref=e931] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: nebo
          - link "společní správci údajů" [ref=e932] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: ) pro pohodlné nastavení webových stránek, pro vytváření statistik nebo pro personalizovanou reklamu; v souvislosti s rámcem IAB TCF celkem 4 reklamními partnery. Zpracování údajů pro personalizovanou reklamu se provádí za účelem řízení vlastní reklamy a umožnění třetím stranám zobrazovat reklamu mimo online marketplace Kauflandu, který je dostupný na adrese www.kaufland.cz, prostřednictvím koncových zařízení přiřazených vám a členům vaší domácnosti. Kromě toho budou údaje o vašem nákupním chování na online marketplace Kauflandu zpřístupněny jednomu z výše uvedených reklamních partnerů, aby mohl jako
          - link "nezávislý správce" [ref=e933] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: údajů měřit úspěšnost reklamních kampaní svých zadavatelů. Kliknutím na možnost „Přizpůsobit“ můžete povolit individuální použití a zobrazit další informace o zpracování údajů.
          - text: Vytváření personalizované reklamy je založeno na generování profilů doplněných také o údaje z jiných webových stránek. To zahrnuje zpracování údajů (např. o vašem používání webových stránek, vašem nákupním chování na online marketplace Kauflandu a přesných údajích o vaší poloze), včetně ukládání a/nebo přístupu k informacím na vašich zařízeních za účelem vytváření cílových skupin (tzv. segmentů). V souvislosti se zobrazováním této reklamy se údaje zpracovávají také za účelem měření reklamy (zejména ke zjišťování její výkonnosti a úspěšnosti), průzkumu cílových skupin (zejména za účelem získání bližších informací o cílových skupinách, kterým je reklama zobrazována), vývoje služeb a technického zabezpečení a optimalizace zobrazování těchto reklam.
          - text: Kliknutím na „Odmítnout“ můžete povolit pouze použití nezbytných technologií. Kliknutím na tlačítko „Souhlasím“ udělujete souhlas se zpracováním údajů pro všechny výše uvedené účely, včetně zapojení všech partnerů. Další informace, včetně informací o době uchovávání údajů a o vašem právu kdykoli odvolat svůj souhlas s účinností do budoucna, naleznete v
          - link "zásadách ochrany osobních údajů" [ref=e934] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: . Informace o společnosti najdete
          - link "zde." [ref=e935] [cursor=pointer]:
            - /url: https://www.kaufland.cz/i/legal/data-privacy/~19I8VY2lHX7Sxl1bCq6DLQ/?hidebanner=true
          - text: "Kliknutím na „Přizpůsobit“ můžete povolit individuální účely použití nebo partnery; to platí i pro níže uvedená použití a funkce v rámci využití IAB TCF pro reklamu a měření úspěšnosti:"
          - text: "Zajištění bezpečnosti, prevenci a odhalování podvodů a odstraňování chyb, přípravu a zobrazování reklamy a obsahu, porovnávání a kombinování dat z různých zdrojů, propojování různých koncových zařízení, identifikaci zařízení na základě automaticky přenášených informací, měření úspěšnosti reklamních kampaní společností TTD a využití telekomunikační technologie od společnosti Utiq pro digitální marketing, a také:"
          - generic [ref=e936]:
