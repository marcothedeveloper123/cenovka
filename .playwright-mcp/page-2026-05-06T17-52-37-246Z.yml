                    - listitem [ref=e498]: iOS 26. NOVÝ VZHLED. PĚKNĚ KOUZELNÝ. - Nový design Liquid Glass. Krásné. Čistý. A tak důvěrně známý. S živější zamykací obrazovkou, přizpůsobitelným pozadím, anketami ve zprávách, filtry hovorů a dalšími funkcemi.
                    - listitem [ref=e499]: VYVINUTO PRO APPLE INTELLIGENCE - Soukromé. Bezpečné. A s velkým výkonem. Napište něco, ukažte svou osobnost a vyřizujte věci mnohem snadněji.
                    - listitem [ref=e500]: SATELITNÍ FUNKCE - Pokud potřebujete tísňové služby, ale nemáte k dispozici síť nebo Wi-Fi, můžete použít nouzové volání SOS přes satelit. A v případě vážné autonehody může iPhone záchranné složky, pokud vy nemůžete.
                    - listitem [ref=e501]: LEPŠÍ PŘIPOJENÍ. SUPER VYSOKÉ RYCHLOSTI. - Buď rychleji připojený díky bezpečnému připojení přes Wi-Fi 7, sítě 5G, Bluetooth 6 a eSIM.
                    - listitem [ref=e502]: eSIM. FLEXIBILNÍ. BEZPEČNÉ. RYCHLÉ. - S eSIM získáte větší flexibilitu, pohodlí, bezpečnost a bezproblémové připojení - zejména na mezinárodních cestách.
