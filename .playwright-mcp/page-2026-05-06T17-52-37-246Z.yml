              - text: Používání přesných údajů o zeměpisné poloze. Ukládání a/nebo přístup k informacím v zařízení. Porozumění publiku prostřednictvím statistik nebo kombinací údajů z různých zdrojů. Měření výkonu reklam. Používání profilů k výběru personalizované reklamy. Vytváření profilů pro personalizovanou reklamu. Použití omezených údajů k výběru reklam. Rozvoj a zlepšování služeb. Měření výkonu obsahu.
