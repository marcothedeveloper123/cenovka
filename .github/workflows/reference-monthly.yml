name: reference-monthly

# ČSÚ publishes average consumer prices monthly, mid-following-month. Kept
# separate from scrape-daily so a ČSÚ outage can't affect the price pipeline
# and a slow scrape can't delay this. Runs in ~2 minutes.
on:
  schedule:
    - cron: '0 4 20 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reference-monthly
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch ČSÚ reference series
        run: npm run reference

      - name: Commit reference data
        run: |
          git config user.name  "cenovka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical/reference.json.gz || true
          if git diff --staged --quiet; then
            echo "No reference changes to commit."
            exit 0
          fi
          MONTH=$(date -u +%Y-%m)
          git commit -m "data: ČSÚ reference prices ${MONTH} [skip ci]"
          # main may have moved under us (the daily scrape commits too), so
          # rebase the data commit on top before pushing. Same shape as
          # scrape-daily.yml — conflicts are unlikely since only this workflow
          # writes reference.json.gz.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — pulling --rebase and retrying"
            git pull --rebase --autostash origin main
          done
          echo "push still failing after retries"
          exit 1
