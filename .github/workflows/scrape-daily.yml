name: scrape-daily

on:
  # 03:00 UTC = 05:00 Europe/Prague (off-peak for CZ retailers).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  # One job per chain in parallel. Fast chains finish in <30 min; Globus
  # alone walks ~34k product listings and routinely runs ~2 h, so a single
  # combined job kept hitting the runner's job timeout. Splitting means each
  # chain gets its own clock.
  scrape:
    strategy:
      fail-fast: false
      matrix:
        chain: [tesco, rohlik, kosik, billa, penny, globus]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scrape ${{ matrix.chain }}
        run: npx tsx src/run.ts --only ${{ matrix.chain }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload raw scrape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.chain }}-${{ github.run_id }}
          path: data/raw/${{ matrix.chain }}/
          if-no-files-found: warn
          retention-days: 14

  # Once every scrape job finishes (success OR failure — we still want to
  # publish whatever did succeed), pull the artefacts together, run the
  # canonical pipeline, commit the gzipped result.
  finalize:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Download all raw artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*-${{ github.run_id }}
          path: artefacts

      - name: Reassemble raw tree
        # Each artefact came from data/raw/<chain>/. The download splits them
        # into artefacts/raw-<chain>-<runid>/. Move into the expected layout.
        run: |
          mkdir -p data/raw
          for dir in artefacts/raw-*-${{ github.run_id }}; do
            chain=$(basename "$dir" | sed -E "s/^raw-(.+)-${{ github.run_id }}$/\1/")
            mkdir -p "data/raw/$chain"
            cp -r "$dir"/* "data/raw/$chain/" 2>/dev/null || true
          done
          ls -la data/raw/*/ | head -40

      - name: Assemble canonical + match groups
        run: |
          npx tsx src/assemble.ts
          npx tsx src/match.ts
          npx tsx src/report.ts || true

      - name: Audit duplicates (informational)
        run: npx tsx src/audit-dups.ts | tail -8 || true

      - name: Commit canonical changes
        run: |
          git config user.name  "cenovka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical/latest.json.gz data/canonical/groups.json.gz || true
          if git diff --staged --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: daily scrape ${DATE} [skip ci]"
          # Workflow runs are long; main may have moved while the scrape was
          # in flight (manual commits, other CI). Rebase the data commit on
          # top of whatever's there before pushing. Conflicts are unlikely
          # since only this workflow writes to data/canonical/*.gz.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — pulling --rebase and retrying"
            git pull --rebase --autostash origin main
          done
          echo "push still failing after retries"
          exit 1

      - name: Upload metrics + per-chain errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.run_id }}
          path: |
            data/canonical/metrics-*.json
            data/raw/*/*.errors.json
          if-no-files-found: ignore
          retention-days: 30
