name: scrape-daily

on:
  # 03:00 UTC = 05:00 Europe/Prague (off-peak for CZ retailers).
  # Two tiers, because Actions minutes are the binding constraint:
  #   daily  — the chains that finish fast enough to run every day
  #   weekly — the slow full-catalogue walkers (Globus ~3 h alone)
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which chain set to scrape'
        type: choice
        options: [daily, weekly, all]
        default: daily

permissions:
  contents: write

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  # Decide which chains run. Per-chain timeouts are observed duration + ~60%
  # headroom, so one stuck chain can no longer burn a 180-minute runner:
  #   kosik 18m · billa 20m · rohlik 67m · tesco 54m · globus 180m(partial)
  # Rohlík gets extra headroom: it throttles to ~half throughput if crawled twice
  # in quick succession, which is what a manual dispatch beside the cron causes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          daily='{"chain":"kosik","timeout":35},{"chain":"billa","timeout":35},{"chain":"rohlik","timeout":140},{"chain":"tesco","timeout":90}'
          weekly='{"chain":"globus","timeout":150}'
          case "${{ github.event_name == 'workflow_dispatch' && inputs.tier || (github.event.schedule == '0 1 * * 0' && 'weekly' || 'daily') }}" in
            daily)  set="$daily" ;;
            weekly) set="$weekly" ;;
            all)    set="$daily,$weekly" ;;
          esac
          echo "matrix={\"include\":[$set]}" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scrape ${{ matrix.chain }}
        run: npx tsx src/run.ts --only ${{ matrix.chain }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload raw scrape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.chain }}-${{ github.run_id }}
          path: data/raw/${{ matrix.chain }}/
          if-no-files-found: warn
          retention-days: 14

  # Once every scrape job finishes (success OR failure — we still want to
  # publish whatever did succeed), pull the artefacts together, run the
  # canonical pipeline, commit the gzipped result.
  finalize:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Download all raw artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*-${{ github.run_id }}
          path: artefacts

      - name: Reassemble raw tree
        # Each artefact came from data/raw/<chain>/. The download splits them
        # into artefacts/raw-<chain>-<runid>/. Move into the expected layout.
        run: |
          mkdir -p data/raw
          for dir in artefacts/raw-*-${{ github.run_id }}; do
            chain=$(basename "$dir" | sed -E "s/^raw-(.+)-${{ github.run_id }}$/\1/")
            mkdir -p "data/raw/$chain"
            cp -r "$dir"/* "data/raw/$chain/" 2>/dev/null || true
          done
          ls -la data/raw/*/ | head -40

      - name: Assemble canonical + match groups
        run: |
          npx tsx src/assemble.ts
          npx tsx src/match.ts
          npx tsx src/report.ts || true

      - name: Audit duplicates (informational)
        run: npx tsx src/audit-dups.ts | tail -8 || true

      - name: Commit canonical changes
        run: |
          git config user.name  "cenovka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical/latest.json.gz data/canonical/groups.json.gz || true
          if git diff --staged --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: daily scrape ${DATE} [skip ci]"
          # Workflow runs are long, so main may have moved while the scrape was
          # in flight. `git pull --rebase` cannot help here: latest.json.gz and
          # groups.json.gz are binary, so a concurrent data commit conflicts and
          # the rebase halts — which is exactly how this step failed on
          # 2026-09-02. Instead, replay our commit onto the new tip without
          # merging: the files on disk were just assembled from this run's full
          # artefact set, so ours is the authoritative version by construction.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — replaying onto origin/main"
            git fetch origin main
            git reset --soft origin/main
            git add data/canonical/latest.json.gz data/canonical/groups.json.gz
            git diff --staged --quiet && { echo "nothing left to commit"; exit 0; }
            git commit -m "data: daily scrape ${DATE} [skip ci]"
          done
          echo "push still failing after retries"
          exit 1

      - name: Upload metrics + per-chain errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.run_id }}
          path: |
            data/canonical/metrics-*.json
            data/raw/*/*.errors.json
          if-no-files-found: ignore
          retention-days: 30
